<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 默认主题为暗色；首帧绘制前同步 html.dark 与 theme-color，避免浅色偏好用户看到暗色闪烁。 -->
    <meta name="theme-color" content="#171a1b" />
    <script>
      try {
        if (localStorage.getItem('meme-share-theme') !== 'light') {
          document.documentElement.classList.add('dark');
        } else {
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#f6f8f8');
        }
      } catch (error) {}
    </script>
    <meta name="description" content="按角色整理、随手可用的表情包收藏。" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>表情包分享</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
